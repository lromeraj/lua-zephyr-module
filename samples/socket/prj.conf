#CONFIG_FLASH=y
CONFIG_PRINTK=y
#CONFIG_SERIAL=y

# for QEMU
CONFIG_QEMU_ICOUNT=n

#CONFIG_ASSERT=y
#CONFIG_FILE_SYSTEM=y

# If picolibc is used, CONFIG_POSIX_API is required since
# the toolchain and also the module build only tinystdio module
# which relies on POSIX API 
CONFIG_PICOLIBC=y
CONFIG_POSIX_API=y
CONFIG_POSIX_NETWORKING=y

#CONFIG_REQUIRES_FLOAT_PRINTF=y
#CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
#CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y

CONFIG_MAIN_STACK_SIZE=16384

## Memory
#CONFIG_HEAP_MEM_POOL_SIZE=2194304
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=262144
# CONFIG_HEAP_MEM_POOL_SIZE=150000
# CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_MAIN_THREAD_PRIORITY=15

# Logging
CONFIG_LOG=y
#CONFIG_LOG_PROCESS_THREAD_PRIORITY=0
#CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_SHOW_COLOR=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=n

CONFIG_LUA=y
CONFIG_LUA_PRINTK=y
CONFIG_LUA_SOCKET=y

CONFIG_NETWORKING=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS=y

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"

CONFIG_DNS_RESOLVER=y
